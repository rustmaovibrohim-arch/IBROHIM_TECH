<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Texnomarket — telefon, noutbuk, PlayStation, AirPods, iPad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Fraunces:opsz,wght@9..144,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./main.css">
</head>

<body>
    <header class="top">
        <a href="#/" class="logo">texno<b>market</b></a>
        <nav>
            <a href="#/" data-r="">Bosh sahifa</a>
            <a href="#/catalog" data-r="catalog">Katalog</a>
            <a href="#/about" data-r="about">Biz haqimizda</a>
        </nav>
        <form id="sf" class="search"><input id="q" placeholder="Qidirish: iPhone, PS5, AirPods…" autocomplete="off">
        </form>
        <button class="ib" id="cartBtn" aria-label="Savat">🛒<span id="cc">0</span></button>
        <button class="btn sm" id="userBtn">Kirish</button>
    </header>
    <main id="app"></main>
    <footer class="foot">
        <div><a href="#/" class="logo">texno<b>market</b></a>
            <p>Original texnika, rasmiy kafolat, shu kunning o'zida yetkazish.</p>
        </div>
        <div>
            <h4>Katalog</h4><a href="#/catalog?cat=phone">Telefonlar</a><a href="#/catalog?cat=laptop">Noutbuklar</a><a
                href="#/catalog?cat=console">PlayStation</a><a href="#/catalog?cat=audio">Quloqchinlar</a>
        </div>
        <div>
            <h4>Aloqa</h4><a href="#/about">Savol yuborish</a><span>Toshkent, Amir Temur ko'chasi</span><span>+998 71
                200 00 00</span>
        </div>
        <small>© 2026 Texnomarket. Barcha huquqlar himoyalangan.</small>
    </footer>
    <div class="modal" id="auth" hidden>
        <div class="box" role="dialog" aria-modal="true">
            <button class="x" data-close aria-label="Yopish">✕</button>
            <div class="tabs"><button data-t="in" class="on">Kirish</button><button data-t="up">Ro'yxatdan
                    o'tish</button></div>
            <form id="af" novalidate>
                <label class="up-only">Ism<input name="name" autocomplete="name" placeholder="Ismingiz"></label>
                <label>Email<input name="email" type="email" autocomplete="email" placeholder="siz@mail.uz"></label>
                <label>Parol<span class="pw"><input name="pass" type="password" autocomplete="current-password"
                            placeholder="Kamida 6 belgi"><button type="button" id="eye"
                            aria-label="Parolni ko'rsatish">👁</button></span></label>
                <div class="meter up-only"><i></i></div>
                <p class="err" id="aerr"></p>
                <button class="btn full" id="asub">Kirish</button>
            </form>
        </div>
    </div>
    <div id="toasts"></div>
    <script src="./main.js"></script>
</body>

</html>
