<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZone Pro | AI & Smart Store</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --bg-light: #f5f6fa;
            --bg-dark: #13131f;
            --card-light: #ffffff;
            --card-dark: #1e1e2e;
            --text-light: #2d3436;
            --text-dark: #dfe6e9;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Dark Mode Variables */
        body.dark-mode {
            --bg-light: var(--bg-dark);
            --card-light: var(--card-dark);
            --text-light: var(--text-dark);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header & Nav */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        body.dark-mode header {
            background: rgba(30, 30, 46, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-widgets {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .weather-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }

        .time-display {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: var(--card-light);
            color: var(--text-light);
            font-size: 1.2rem;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            transform: rotate(180deg);
        }

        /* Main Container */
        .container {
            padding: 40px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Categories Grid */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            animation: fadeInUp 0.8s ease;
        }

        .cat-card {
            background: var(--card-light);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            border: 1px solid transparent;
        }

        .cat-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
        }

        .cat-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-text-fill-color: transparent;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .prod-card {
            background: var(--card-light);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
            animation: popIn 0.5s ease forwards;
            opacity: 0;
            display: flex;
            flex-direction: column;
        }

        .prod-img {
            height: 180px;
            background: rgba(108, 92, 231, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: var(--primary);
        }

        .prod-info {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .prod-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
            margin-top: auto;
            padding-top: 10px;
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn:hover {
            background: var(--secondary);
        }

        /* AI Chat Widget */
        .ai-widget {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .ai-bubble {
            background: var(--card-light);
            width: 350px;
            height: 450px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.4s ease;
            border: 1px solid rgba(108, 92, 231, 0.2);
        }

        .ai-header {
            background: var(--primary);
            padding: 15px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ai-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(108, 92, 231, 0.05);
        }

        .msg {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .msg.user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .msg.ai {
            align-self: flex-start;
            background: var(--card-light);
            border-bottom-left-radius: 2px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .ai-input-area {
            padding: 10px;
            display: flex;
            gap: 10px;
            background: var(--card-light);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        .ai-input {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ddd;
            outline: none;
            background: var(--bg-light);
            color: var(--text-light);
        }

        .ai-send {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
        }

        .ai-trigger {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
            animation: pulse 2s infinite;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(108, 92, 231, 0.7);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(108, 92, 231, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(108, 92, 231, 0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-widgets {
                gap: 10px;
            }

            .weather-badge span {
                display: none;
            }

            .ai-bubble {
                width: calc(100vw - 40px);
                right: -10px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo" onclick="goHome()"><i class="fas fa-bolt"></i> TechZone Pro</div>
        <div class="header-widgets">
            <div class="weather-badge" id="weatherBadge">
                <i class="fas fa-spinner fa-spin"></i> <span>Yuklanmoqda...</span>
            </div>
            <div class="time-display" id="clock">00:00:00</div>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn"><i class="fas fa-moon"></i></button>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container" id="mainContainer"></div>

    <!-- AI Widget -->
    <div class="ai-widget">
        <div class="ai-bubble" id="aiBubble">
            <div class="ai-header">
                <div><i class="fas fa-robot"></i> Nexus AI</div>
                <i class="fas fa-times" style="cursor:pointer" onclick="toggleAI()"></i>
            </div>
            <div class="ai-messages" id="aiMessages">
                <div class="msg ai">Salom! Men TechZone AI yordamchisiman. Mahsulotlar, ob-havo yoki boshqa
                    savollaringiz bo'lsa, bemalol so'rang!</div>
            </div>
            <div class="ai-input-area">
                <input type="text" class="ai-input" id="aiInput" placeholder="Savolingizni yozing..."
                    onkeypress="if(event.key==='Enter') sendAIMessage()">
                <button class="ai-send" onclick="sendAIMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
        <button class="ai-trigger" onclick="toggleAI()"><i class="fas fa-comment-dots"></i></button>
    </div>

    <script>
        // --- 1. REAL VAQT (O'zbekiston vaqti) ---
        function updateClock() {
            const now = new Date();
            const options = { timeZone: 'Asia/Tashkent', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('clock').innerText = now.toLocaleTimeString('uz-UZ', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 2. HAQIQIY OB-HAVO (Open-Meteo API - Kalitsiz) ---
        async function fetchWeather() {
            try {
                // Toshkent koordinatalari: 41.2995, 69.2401
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=41.2995&longitude=69.2401&current_weather=true');
                const data = await res.json();

                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;

                // WMO kodlarini ikonkalarga aylantirish
                let icon = 'fa-sun';
                if (code > 3) icon = 'fa-cloud';
                if (code > 50) icon = 'fa-cloud-rain';
                if (code > 70) icon = 'fa-snowflake';

                document.getElementById('weatherBadge').innerHTML =
                    `<i class="fas ${icon}"></i> <span>${temp}°C Toshkent</span>`;
            } catch (e) {
                document.getElementById('weatherBadge').innerHTML = `<i class="fas fa-exclamation-triangle"></i> <span>Xatolik</span>`;
            }
        }
        fetchWeather();
        setInterval(fetchWeather, 600000); // Har 10 daqiqada yangilash

        // --- 3. TUN/KUN REJIMI ---
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeBtn').innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
        // Saqlangan temani yuklash
        if (localStorage.getItem('theme') === 'dark') toggleTheme();

        // --- 4. MAHSULOTLAR VA KATEGORIYALAR ---
        const categories = [
            { id: 'phones', name: 'Telefonlar', icon: 'fa-mobile-alt' },
            { id: 'laptops', name: 'Noutbuklar', icon: 'fa-laptop' },
            { id: 'tablets', name: 'Planshetlar', icon: 'fa-tablet-alt' },
            { id: 'playstation', name: 'PlayStation', icon: 'fa-gamepad' },
            { id: 'headphones', name: 'Quloqchinlar', icon: 'fa-headphones' },
            { id: 'watches', name: 'Soatlar', icon: 'fa-clock' }
        ];
        const brands = ["Samsung", "Apple", "Sony", "Xiaomi", "HP", "Asus", "JBL", "Garmin"];

        function renderHome() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <h2 style="margin-bottom:20px; animation:fadeInUp 0.5s ease">Kategoriyalar</h2>
                <div class="categories-grid">
                    ${categories.map(c => `
                        <div class="cat-card" onclick="openCategory('${c.id}')">
                            <i class="fas ${c.icon} cat-icon"></i>
                            <h3>${c.name}</h3>
                            <p style="color:#888; font-size:0.8rem; margin-top:5px">50+ mahsulot</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function openCategory(id) {
            const cat = categories.find(c => c.id === id);
            const container = document.getElementById('mainContainer');

            // Loading state
            container.innerHTML = `<div style="text-align:center; padding:50px; font-size:2rem; color:var(--primary)"><i class="fas fa-spinner fa-spin"></i></div>`;

            setTimeout(() => {
                let productsHTML = '';
                for (let i = 1; i <= 50; i++) {
                    const brand = brands[Math.floor(Math.random() * brands.length)];
                    const price = (Math.floor(Math.random() * 2000) + 100) * 1000;
                    productsHTML += `
                        <div class="prod-card" style="animation-delay:${(i % 10) * 0.05}s">
                            <div class="prod-img"><i class="fas ${cat.icon}"></i></div>
                            <div class="prod-info">
                                <small style="color:var(--primary); font-weight:bold">${brand}</small>
                                <h4>${cat.name} Pro ${i} Gen</h4>
                                <div class="prod-price">${price.toLocaleString('uz-UZ')} so'm</div>
                                <button class="add-btn" onclick="addToCart(this)">Savatga qo'shish</button>
            </div>
                        </div>
                    `;
                }

                container.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; animation:fadeInUp 0.5s ease">
                        <button onclick="renderHome()" style="padding:10px 20px; border-radius:20px; border:none; background:var(--card-light); color:var(--text-light); cursor:pointer; box-shadow:var(--shadow)"><i class="fas fa-arrow-left"></i> Orqaga</button>
                        <h2>${cat.name}</h2>
                        <div style="width:80px"></div>
                    </div>
                    <div class="products-grid">${productsHTML}</div>
                `;
            }, 400);
        }

        function addToCart(btn) {
            btn.innerHTML = '<i class="fas fa-check"></i> Qo\'shildi';
            btn.style.background = '#00b894';
            setTimeout(() => {
                btn.innerHTML = 'Savatga qo\'shish';
                btn.style.background = 'var(--primary)';
            }, 1500);
        }

        function goHome() { renderHome(); }
        window.onload = renderHome;

        // --- 5. AQILLI AI CHATBOT ---
        function toggleAI() {
            const bubble = document.getElementById('aiBubble');
            bubble.style.display = bubble.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendAIMessage() {
            const input = document.getElementById('aiInput');
            const msg = input.value.trim();
            if (!msg) return;

            addMessage(msg, 'user');
            input.value = '';

            // AI "o'ylash" effekti
            setTimeout(() => {
                const response = generateSmartResponse(msg.toLowerCase());
                addMessage(response, 'ai');
            }, 600);
        }

        function addMessage(text, type) {
            const container = document.getElementById('aiMessages');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // AI Mantiqi (Pattern Matching + Context)
        function generateSmartResponse(input) {
            if (input.includes('salom') || input.includes('assalom')) return "Assalomu alaykum! 👋 TechZone ga xush kelibsiz. Sizga qanday yordam bera olaman?";
            if (input.includes('narx') || input.includes('pul')) return "Narxlarimiz juda qulay! Telefonlar 1 mln dan, noutbuklar esa 3 mln so'mdan boshlanadi. Aniq modelni aytsangiz, narxini aytib beraman.";
            if (input.includes('telefon')) return "Eng zo'r telefonlar bu iPhone 15 Pro va Samsung S24 Ultra. Hozirda aksiyada! 📱";
            if (input.includes('noutbuk')) return "Dasturchilar uchun MacBook Air M2 yoki Asus Zenbook tavsiya qilaman. 💻";
            if (input.includes('ob-havo')) return "Hozir Toshkentda ob-havo ma'lumotlari tepada ko'rsatilgan. Lekin men sizga do'kon ichidagi 'issiqlik'ni kafolatlayman! 🔥";
            if (input.includes('yetkazib')) return "Yetkazib berish xizmati Toshkent bo'ylab 2 soat ichida, viloyatlarga esa 1-2 kun ichida amalga oshiriladi. 🚚";
            if (input.includes('rahmat')) return "Arzimaydi! 😊 Yana savollaringiz bo'lsa, men doimo shu yerda man.";

            return "Bu juda qiziq savol! 🤔 Men hozircha faqat texnika va do'kon haqida bilaman. Iltimos, mahsulotlar, narxlar yoki yetkazib berish haqida so'rang.";
        }
    </script>
</body>

</html>
